# Deploys main to the official copy on Cloudflare Pages (spec 09, ADR-024). This is a software
# task, not CRM work (ADR-006): no CRM data passes through it.
#
# The build job has no secrets. It runs every check and builds once. The deploy job gets only the
# Cloudflare token: it uploads that same build with wrangler from deploy/package-lock.json, then
# checks the live site. Actions are pinned to commit SHAs, because a tag can move.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time. A newer push replaces a queued run, so the newest main wins.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm test
      # tsc, vite build, and the build audit (docs/07).
      - run: npm run build
      # The browser tests serve dist/, the folder that the deploy job uploads.
      - run: npm run test:e2e
        env:
          E2E_BUILD: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - run: npm ci --prefix deploy --no-audit --no-fund
      - name: Upload dist/ to Cloudflare Pages
        run: deploy/node_modules/.bin/wrangler pages deploy dist --project-name gitcrm --branch main --commit-hash "$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
      - name: Check the live site
        run: node scripts/check-deploy.ts https://gitcrm.pages.dev/ dist
